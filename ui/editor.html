<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <link rel="stylesheet" href="editor.css">
</head>
<body>
    <div id="header">
        <div id="tabs">
            <button id="tabModel" class="tab">Модель</button>
            <button id="tabComponent" class="tab active">Компонент не выбран</button>
        </div>
        <div id="buttonRow">
            <button id="copyBtn" title="Копировать код в буфер">
                <svg viewBox="0 0 16 16" width="16" height="16">
                    <rect x="4" y="2" width="9" height="11" rx="1" fill="none" stroke="currentColor" stroke-width="1.4"/>
                    <rect x="2" y="4" width="9" height="11" rx="1" fill="none" stroke="currentColor" stroke-width="1.4"/>
                </svg>
            </button>
            <button id="pasteBtn" title="Вставить код из буфера">
                <svg viewBox="0 0 16 16" width="16" height="16">
                    <rect x="3" y="3" width="10" height="11" rx="1" fill="none" stroke="currentColor" stroke-width="1.4"/>
                    <path d="M 6 3 L 6 1.5 L 10 1.5 L 10 3" fill="none" stroke="currentColor" stroke-width="1.4"/>
                    <line x1="5.5" y1="7" x2="10.5" y2="7" stroke="currentColor" stroke-width="1.3"/>
                    <line x1="5.5" y1="9.5" x2="10.5" y2="9.5" stroke="currentColor" stroke-width="1.3"/>
                </svg>
            </button>
            <button id="applyBtn" title="Применить код (выполнить)">
                <svg viewBox="0 0 16 16" width="16" height="16">
                    <path d="M 3 8.5 L 7 12 L 13 4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </button>
            <button id="freezeBtn" title="Заморозить / Разморозить">
                <svg viewBox="0 0 16 16" width="16" height="16">
                    <line x1="8" y1="2" x2="8" y2="14" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
                    <line x1="2" y1="8" x2="14" y2="8" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
                    <line x1="3.7" y1="3.7" x2="12.3" y2="12.3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
                    <line x1="3.7" y1="12.3" x2="12.3" y2="3.7" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
                </svg>
            </button>
            <span class="spacer"></span>
            <button id="fontMinusBtn" title="Уменьшить шрифт">A−</button>
            <button id="fontPlusBtn" title="Увеличить шрифт">A+</button>
        </div>
    </div>
    <textarea id="code" spellcheck="false"></textarea>
    <script src="editor.js"></script>
</body>
</html>
